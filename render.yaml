services:
  - type: web
    name: kavali-erp
    env: docker
    repo: https://github.com/monsieurgbato/kavali-erp
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kavali-erp-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_DEFAULT_SENDER
        value: ivoireblack8@gmail.com
      - key: RESET_HOST
        value: https://kavali-erp.onrender.com

databases:
  - name: kavali-erp-db
    databaseName: kavali
    user: kavali
    plan: free
    postgresMajorVersion: 15