{% extends "base.html" %}

{% block title %}KAVALI ERP — Nouveau relevé carburant{% endblock %}

{% block breadcrumb %}
<a href="{{ url_for('dashboard.index') }}" class="crumb">Tableau de bord</a>
<span class="sep">/</span>
<a href="{{ url_for('fleet.vehicles_list') }}" class="crumb">Flotte</a>
<span class="sep">/</span>
<a href="{{ url_for('fleet.fuel_list') }}" class="crumb">Carburant</a>
<span class="sep">/</span>
<span class="current">Nouveau relevé</span>
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Nouveau relevé carburant</h1>
        <p class="text-muted">Enregistrer un achat de carburant</p>
    </div>
</div>

<div class="card" style="max-width:700px;">
    <form method="POST" action="{{ url_for('fleet.fuel_create') }}" class="form">
        <div class="form-group">
            <label class="form-label">Véhicule *</label>
            <select name="vehicle_id" class="form-input" required>
                <option value="">Sélectionner un véhicule...</option>
                {% for v in vehicles %}
                <option value="{{ v.id }}">{{ v.immatriculation }} — {{ v.brand }} {{ v.model }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
            <div class="form-group">
                <label class="form-label">Date</label>
                <input type="date" name="date" class="form-input" value="{{ '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Litres *</label>
                <input type="number" name="liters" class="form-input" required step="0.01" min="0.01" placeholder="0" value="">
            </div>
            <div class="form-group">
                <label class="form-label">Prix unitaire (FCFA/L) *</label>
                <input type="number" name="unit_price" class="form-input" required step="0.01" min="0.01" placeholder="0" value="">
            </div>
            <div class="form-group">
                <label class="form-label">Compteur (km)</label>
                <input type="number" name="odometer" class="form-input" min="0" placeholder="0" value="">
            </div>
            <div class="form-group">
                <label class="form-label">Station</label>
                <input type="text" name="station" class="form-input" placeholder="Nom de la station" value="">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-input" rows="2" placeholder="Notes..."></textarea>
        </div>

        <div class="form-actions" style="display:flex;gap:1rem;margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary btn-lg">Enregistrer le relevé</button>
            <a href="{{ url_for('fleet.fuel_list') }}" class="btn btn-ghost btn-lg">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
