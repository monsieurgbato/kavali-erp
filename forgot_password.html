<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAVALI ERP — Mot de passe oublié</title>
    <link rel="icon" href="{{ url_for('static', filename='img/kavali-favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0A3809 0%, #1a4f1a 50%, #0A3809 100%);
            padding: 1.5rem;
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-section img {
            height: 52px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        .logo-section .logo-tagline {
            color: rgba(255,255,255,0.5);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 2.25rem 2rem 2rem;
            box-shadow: 0 25px 60px rgba(10, 56, 9, 0.5);
        }

        .card-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0A3809;
            margin-bottom: 0.35rem;
        }

        .card-subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #6b7280;
            margin-bottom: 1.75rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.4rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s;
            background: #f9fafb;
        }

        .form-input:focus {
            outline: none;
            border-color: #937C33;
            box-shadow: 0 0 0 3px rgba(147,124,51,0.15);
            background: #fff;
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .btn-submit {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            color: #fff;
            background: linear-gradient(135deg, #0A3809, #1a5f19);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(10, 56, 9, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-bottom: 1.25rem;
            text-align: center;
        }

        .alert-success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.8rem;
            color: #6b7280;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #0A3809;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #6b7280;
            text-decoration: none;
        }

        .back-link:hover {
            color: #0A3809;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="logo-section">
            <img src="{{ url_for('static', filename='img/kavali-logo-light.svg') }}" alt="KAVALI ERP">
            <div class="logo-tagline">ERP — Côte d'Ivoire</div>
        </div>

        <div class="login-card">
            <div class="card-title">🔑 Mot de passe oublié</div>
            <div class="card-subtitle">
                Saisissez votre email professionnel.<br>
                Nous vous enverrons un lien de réinitialisation.
            </div>

            {% if sent %}
            <div class="alert alert-success">
                ✅ Si cet email est associé à un compte,<br>vous recevrez un lien de réinitialisation.
            </div>
            <a href="{{ url_for('auth.login') }}" class="back-link">← Retour à la connexion</a>
            {% else %}
            <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                <div class="form-group">
                    <label for="email">📧 Email professionnel</label>
                    <input type="email" id="email" name="email" class="form-input"
                           placeholder="exemple@kavali.ci" required autofocus>
                </div>
                <button type="submit" class="btn-submit">Envoyer le lien</button>
            </form>
            <a href="{{ url_for('auth.login') }}" class="forgot-link">← Retour à la connexion</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
